<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevTrack</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Github Explorer</h1>

    <div class="search">
      <input id="username" type="text" placeholder="Enter a GitHub username" />
      <button id="searchBtn">Search</button>
      
    </div>

    <div id="results">
      <!--so we have to create js elements for our webpage cuz it is it is something that we render-->
      <p>Type in the Github username</p>
    </div>

    <div id="Repos">
      <h3> This is the Repository Section</h3>
      <p>Filter repositories by language</p>
      <!--for the lang dropdown we need to use the select tag-->
      <select id="lang-dropdown">
        <option value="all">All languages</option>
        <option value="JavaScript">JavaScript</option>
        <option value="Python">Python</option>
        <option value="HTML">HTML</option>
      </select>
      <p>Repository list appears here</p>
    </div>

    <!-- the div should have a parent child rls for me to have the dropdown -->
  

    
  </main>

  <script src="main.js"></script>
</body>
</html>
